name: P1 cross-repository contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-cross-repository:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spec revision
        uses: actions/checkout@v4

      - name: Read pinned Browser baseline
        id: browser-pin
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const value = JSON.parse(fs.readFileSync("p1-browser-baseline.json", "utf8"));
            if (value.repository !== "Let-s-Inspire/webspace-browser") throw new Error("unexpected Browser repository");
            if (!/^[0-9a-f]{40}$/.test(value.canonicalCommit)) throw new Error("invalid Browser canonical commit");
            if (!/^[0-9a-f]{40}$/.test(value.reviewedImplementation)) throw new Error("invalid reviewed implementation");
            if (value.profile !== "experimental-v0") throw new Error("unexpected profile");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `repository=${value.repository}\ncommit=${value.canonicalCommit}\n`);
          '

      - name: Check out exact Browser commit
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.browser-pin.outputs.repository }}
          ref: ${{ steps.browser-pin.outputs.commit }}
          path: webspace-browser
          fetch-depth: 0

      - name: Install lockfile-pinned dependencies
        run: |
          npm ci
          npm ci --prefix webspace-browser

      - name: Verify pinned Browser checkout
        env:
          WEBSPACE_BROWSER_ROOT: ${{ github.workspace }}/webspace-browser
        run: npm run check:p1-browser-baseline

      - name: Run Spec schemas and P1 gates
        env:
          WEBSPACE_BROWSER_ROOT: ${{ github.workspace }}/webspace-browser
        run: |
          npm test
          npm run check:p1-cross-repo
          npm run test:p1-cross-repo

      - name: Syntax and diff checks
        run: |
          node --check scripts/check-p1-browser-baseline.mjs
          node --check scripts/check-p1-cross-repo-contract.mjs
          node --check scripts/check-p1-container-contract.mjs
          node --check scripts/check-p1-logical-equivalence.mjs
          node --check scripts/check-p1-html-carrier.mjs
          node --check scripts/check-p1-carrier-connector.mjs
          node --check scripts/lib/p1-cross-repo-contract.mjs
          node --check scripts/lib/p1-container-contract.mjs
          node --check scripts/lib/p1-logical-equivalence.mjs
          node --check scripts/lib/p1-html-carrier.mjs
          git diff --check
          git -C webspace-browser diff --check
